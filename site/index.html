<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Infinity Liquid</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            cursor: none;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* КУРСОР: ЭФФЕКТ КАПЛИ РТУТИ */
        .cursor-wrap {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 9999;
            will-change: transform;
        }

        #c-main {
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            filter: blur(1px);
            box-shadow: 0 0 20px #fff;
        }

        #c-aura {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            margin: -24px 0 0 -24px; /* центрирование */
        }

        /* КНОПКА: ПРОЗРАЧНЫЙ ОВАЛ */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
        }

        .dm-btn {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Segoe UI', sans-serif;
            font-size: 20px;
            font-weight: 200;
            letter-spacing: 15px;
            text-transform: uppercase;
            
            /* Сверхпрозрачный овал */
            padding: 25px 90px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.01);
            border-radius: 100px; /* Овальность */
            backdrop-filter: blur(3px);
            
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .dm-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
            letter-spacing: 25px;
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div id="cursor" class="cursor-wrap">
        <div id="c-main"></div>
        <div id="c-aura"></div>
    </div>

    <div class="container">
        <a href="https://t.me" class="dm-btn" id="btn">dm</a>
    </div>

    <canvas id="sky"></canvas>

    <script>
        const canvas = document.getElementById('sky');
        const ctx = canvas.getContext('2d');
        
        let w, h, stars = [];
        let mouse = { x: window.innerWidth/2, y: window.innerHeight/2 };
        let smoothMouse = { x: window.innerWidth/2, y: window.innerHeight/2 };

        function init() {
            w = window.innerWidth;
            h = window.innerHeight;
            canvas.width = w;
            canvas.height = h;
            stars = [];
            // Еще больше звезд для плотности
            for(let i=0; i<2000; i++) {
                stars.push({
                    x: Math.random() * w - w/2,
                    y: Math.random() * h - h/2,
                    z: Math.random() * w,
                    size: Math.random() * 3 + 0.5
                });
            }
        }

        // Плавная интерполяция (Lerp)
        const lerp = (a, b, n) => (1 - n) * a + n * b;

        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, w, h);

            // Плавное следование координат для параллакса
            smoothMouse.x = lerp(smoothMouse.x, mouse.x, 0.05);
            smoothMouse.y = lerp(smoothMouse.y, mouse.y, 0.05);

            stars.forEach(s => {
                s.z -= 0.8; // Базовая скорость полета
                if(s.z <= 0) s.z = w;

                const k = 128.0 / s.z;
                // Проекция + Параллакс (движение фона от курсора)
                const px = s.x * k + w/2 + (smoothMouse.x - w/2) * (k * 0.1);
                const py = s.y * k + h/2 + (smoothMouse.y - h/2) * (k * 0.1);

                if(px > 0 && px < w && py > 0 && py < h) {
                    const size = s.size * k;
                    const opacity = 1 - (s.z / w);
                    ctx.beginPath();
                    ctx.arc(px, py, size, 0, Math.PI*2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                    ctx.fill();
                }
            });

            // Движение курсора (ртутная плавность)
            const cursor = document.getElementById('cursor');
            const aura = document.getElementById('c-aura');
            
            // Текущее положение курсора
            let currX = parseFloat(cursor.dataset.x || 0);
            let currY = parseFloat(cursor.dataset.y || 0);
            
            let nextX = lerp(currX, mouse.x, 0.2);
            let nextY = lerp(currY, mouse.y, 0.2);
            
            cursor.style.transform = `translate(${nextX}px, ${nextY}px)`;
            cursor.dataset.x = nextX;
            cursor.dataset.y = nextY;

            requestAnimationFrame(draw);
        }

        // Эффект на кнопке для ауры курсора
        const btn = document.getElementById('btn');
        btn.addEventListener('mouseenter', () => {
            document.getElementById('c-aura').style.transform = 'scale(2)';
            document.getElementById('c-aura').style.background = 'rgba(255,255,255,0.05)';
        });
        btn.addEventListener('mouseleave', () => {
            document.getElementById('c-aura').style.transform = 'scale(1)';
            document.getElementById('c-aura').style.background = 'transparent';
        });

        window.addEventListener('resize', init);
        init();
        draw();
    </script>
</body>
</html>
